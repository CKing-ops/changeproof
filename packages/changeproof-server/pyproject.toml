[project]
name = "changeproof-server"
version = "0.1.0"
description = "Optional add-on: serves the changeproof engine inside a client's private network"
requires-python = ">=3.12,<3.13"
dependencies = [
    "changeproof==0.1.0",
]

[project.scripts]
changeproof-server = "changeproof_server:main"

[tool.uv.sources]
changeproof = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/changeproof_server"]
