version: 0.1
market: {market}                          # general | us-defense | eu-dora (docs/adr/004-market-profiles.md)
system:
  name: {name}
  owner: {owner}
  classification: {classification}   # {classifications}

# One entry per part of the system. `language` picks the adapter.
components: []
#  - id: pay-batch
#    path: src/cobol/pay
#    language: cobol
#    criticality: high
#    data_stores: [PAYDB]
#    relied_on_by: [finance-reporting]

evidence:
  produce: [impact, behavioral-equivalence, crypto-inventory]
  outputs: [in-toto]

crypto:
  profile: hybrid                        # hybrid | nist-pqc | classical-legacy
  signing: [ml-dsa-87, ecdsa-p384]
  release_signing: lms-sha256-192
  hash: sha-384

optimization:
  backend: classical                     # classical | quantum-sim | qpu

# Nothing leaves this machine unless this section allows it. See docs/adr/003-data-egress.md.
egress:
  allowed: false
  data_tier: public                      # public | synthetic | customer
  approved_vendors: []
  customer_approval_ref: null
  ict_register_ref: null                 # vendor register entry (required by eu-dora)
  processing_region: null                # eea | adequacy | other (checked by eu-dora)
  require_pq_transport: true

policy: []
frameworks: {frameworks}
