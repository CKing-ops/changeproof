version: 0.1
market: eu-dora
system:
  name: eu-payments-core
  owner: ict-risk-office
  classification: confidential          # public | internal | confidential | restricted
components:
  - id: pay-batch
    path: src/cobol/pay
    language: cobol                      # selects the adapter
    criticality: high
    data_stores: [PAYDB, VSAM.PAYMAST]
    relied_on_by: [sepa-gateway, regulatory-reporting]
evidence:
  produce: [impact, behavioral-equivalence, crypto-inventory]
  outputs: [in-toto, oscal, cyclonedx-cbom, pdf]
crypto:
  profile: hybrid                        # hybrid | nist-pqc | classical-legacy
  signing: [ml-dsa-87, ecdsa-p384]       # hybrid until the EU PQC roadmap's 2030 high-risk deadline
  release_signing: lms-sha256-192
  hash: sha-384
optimization:
  backend: classical                     # classical | quantum-sim | qpu (public/synthetic data only)
egress:
  allowed: false                         # default; must be explicitly enabled
  data_tier: public                      # public | synthetic | customer
  approved_vendors: []
  customer_approval_ref: null            # written approval, required for customer data
  ict_register_ref: null                 # DORA register of information entry, required for customer data
  processing_region: null                # eea | adequacy | other
  require_pq_transport: true
policy:
  - rule: high-criticality-needs-two-approvers
  - rule: equivalence-required-outside-impact-set
  - rule: no-new-quantum-vulnerable-crypto
frameworks: [dora, dora-rts-ict-risk, eu-pqc-roadmap, gdpr]
